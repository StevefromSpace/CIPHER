# CIPHER Continuous Integration
#
# This workflow runs on every push to main and on every pull request.
# It builds the project and runs the test suite on two platforms:
#   - ubuntu-24.04   : GCC on Ubuntu 24.04 LTS (pinned to avoid ubuntu-latest
#                      migration notices; stable until at least April 2029)
#   - windows-2022   : MSVC via the Visual Studio 2022 generator (pinned)
#
# A dedicated Python job tests the assistant integration adapters and developer pipeline.
#
# The default build needs no AI providers, paid services, API keys, or models.
# The llama-runtime job builds the optional in-process llama.cpp backend
# (pinned source tarball, SHA-256 checked by CMake) and runs real inference on
# a tiny pinned GGUF test model (also SHA-256 checked). No API keys are used.

name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base != main) must also receive CI runs.
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false          # Let both platforms run even if one fails
      matrix:
        include:
          - os: ubuntu-24.04
            preset: unix        # Used only as a label; we configure manually

          - os: windows-2022
            preset: windows

    steps:
      # 1. Check out the repository.
      - name: Check out source
        uses: actions/checkout@v7

      # 2. Configure the CMake build.
      #    -DCMAKE_BUILD_TYPE=Release selects an optimised build.
      #    BUILD_TESTING=ON (the default) ensures the test target is compiled.
      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # 3. Compile every target (main library, executable, and test binary).
      - name: Build
        run: cmake --build build --config Release

      # 4. Run the CTest suite.
      #    --output-on-failure prints the test program's stdout/stderr only
      #    when a test fails, keeping successful logs clean.
      - name: Test (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

  llama-runtime:
    name: llama.cpp Runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    env:
      # ggml-org/models at a fixed commit; 1.2 MB story model, enough to prove real inference.
      TEST_GGUF_URL: https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/tinyllamas/stories260K.gguf
      TEST_GGUF_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download pinned test model
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stories260K.gguf" "$TEST_GGUF_URL"
          echo "$TEST_GGUF_SHA256  $RUNNER_TEMP/stories260K.gguf" | sha256sum -c -
          echo "CIPHER_TEST_GGUF=$RUNNER_TEMP/stories260K.gguf" >> "$GITHUB_ENV"

      - name: Configure (CMake, llama.cpp on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCIPHER_WITH_LLAMA=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (CTest, includes real inference)
        run: ctest --test-dir build -C Release --output-on-failure

  python-tests:
    name: Assistant Adapters & Pipeline Tests (Python)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build C++ Test Binaries for Pipeline Verifier
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          for f in build/cipher_*tests; do cp "$f" "$f.exe"; done
          chmod +x build/*.exe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Development and Pipeline Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Assistant Integration Tests (OpenClaw, Dodaios, Leon, OVOS)
        run: python -m unittest discover -s integrations

      - name: Run Developer Pipeline Tests
        run: python -m unittest discover -s tools/pipeline/tests
