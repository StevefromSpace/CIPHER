# CIPHER Continuous Integration
#
# This workflow runs on every push to main and on every pull request.
# It builds the project and runs the test suite on two platforms:
#   - ubuntu-24.04   : GCC on Ubuntu 24.04 LTS (pinned to avoid ubuntu-latest
#                      migration notices; stable until at least April 2029)
#   - windows-2022   : MSVC via the Visual Studio 2022 generator (pinned)
#
# No AI providers, paid services, API keys, or model downloads are involved.
# The entire build is self-contained: standard library only, no third-party
# runtime dependencies.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false          # Let both platforms run even if one fails
      matrix:
        include:
          - os: ubuntu-24.04
            preset: unix        # Used only as a label; we configure manually

          - os: windows-2022
            preset: windows

    steps:
      # 1. Check out the repository.
      - name: Check out source
        uses: actions/checkout@v7

      # 2. Configure the CMake build.
      #    -DCMAKE_BUILD_TYPE=Release selects an optimised build.
      #    BUILD_TESTING=ON (the default) ensures the test target is compiled.
      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # 3. Compile every target (main library, executable, and test binary).
      - name: Build
        run: cmake --build build --config Release

      # 4. Run the CTest suite.
      #    --output-on-failure prints the test program's stdout/stderr only
      #    when a test fails, keeping successful logs clean.
      - name: Test (CTest)
        run: ctest --test-dir build -C Release --output-on-failure
